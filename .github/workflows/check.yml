name: Check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENAI_AGENTS_DISABLE_TRACING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Offline tests
        run: python -m pytest -q
      - name: Check documentation changes
        shell: bash
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_docs_sync.py --base "${DOCS_BASE:-EMPTY}"
